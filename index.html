<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Hexenpost">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4a3868">
<meta name="robots" content="noindex, nofollow">

<title>Hexenpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecef; --panel:#fbfaf6; --panel-2:#eef0f2; --ink:#1f2a37; --muted:#5d6b7a; --line:#d3d8de; --post:#ffcc00; --post-ink:#1f2a37;
  --der:#2f7fc8; --die:#c8392d; --das:#2f8f3c; --shade:rgba(15,22,30,.55);
  --display:"Fraunces",Georgia,serif; --plum:#4a3868; --cream:#fbf3df; --body:"Atkinson Hyperlegible","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#11161c; --panel:#1b232c; --panel-2:#242e39; --ink:#eef1f4; --muted:#a3b0bd; --line:#34404d; --der:#5aaef0; --die:#f06a5c; --das:#5fcb6b; --shade:rgba(0,0,0,.6); }
}
:root[data-theme="dark"]{ --bg:#11161c; --panel:#1b232c; --panel-2:#242e39; --ink:#eef1f4; --muted:#a3b0bd; --line:#34404d; --der:#5aaef0; --die:#f06a5c; --das:#5fcb6b; --shade:rgba(0,0,0,.6); }
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--post);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{position:relative;background:#2f5a32;overflow:hidden;border-radius:8px;box-shadow:0 0 0 1px var(--line)}
#cv{position:relative;display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#glcv{position:absolute;inset:0;width:100%;height:100%;display:none;image-rendering:pixelated;image-rendering:crisp-edges}
.art{font-weight:700}
.art.der{color:var(--der)} .art.die{color:var(--die)} .art.das{color:var(--das)}
#dialog .art.der,#quiz .art.der,.toast .art.der{color:#5aaef0}
#dialog .art.die,#quiz .art.die,.toast .art.die{color:#f06a5c}
#dialog .art.das,#quiz .art.das,.toast .art.das{color:#5fcb6b}

/* HUD */
#hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:.5em .6em;pointer-events:none;font-size:clamp(12px,2.2vmin,17px);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000}
#hudLeft{display:flex;flex-direction:column;gap:.35em}
#money{font-weight:700;background:var(--post);color:var(--post-ink);text-shadow:none;border-radius:999px;padding:.1em .7em;align-self:flex-start}
#crates{display:flex;gap:.3em}
.crate{display:inline-flex;align-items:center;gap:1px;min-width:1.9em;height:1.9em;padding:0 .25em;border-radius:6px;border:2px solid rgba(255,255,255,.6);text-shadow:none}
.crate.der{background:#2f7fc8}.crate.die{background:#c8392d}.crate.das{background:#2f8f3c}
.crate img{width:1.3em;height:1.3em;image-rendering:pixelated}
.crate b{font-size:.75em;color:#fff;margin-right:.15em}
#nameCount{font-weight:700}
#objective{position:absolute;left:.6em;bottom:.6em;max-width:58%;font-size:clamp(11px,2vmin,15px);color:#fff;text-shadow:0 1px 0 #000,0 0 3px #000;pointer-events:none;line-height:1.3;background:rgba(20,28,36,.55);padding:.3em .6em;border-radius:8px}
#objective:empty{display:none}
#objective b{color:var(--post)}
#prompt{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);background:rgba(20,28,36,.88);color:#fff;border:1px solid rgba(255,204,0,.7);border-radius:999px;padding:.25em .9em;font-size:clamp(12px,2.2vmin,17px);pointer-events:none;white-space:nowrap}
#prompt[hidden]{display:none}
#hudBtns{position:absolute;right:.5em;bottom:.5em;display:flex;gap:.4em}
.iconbtn{position:relative;background:rgba(20,28,36,.85);border:1px solid rgba(255,255,255,.25);border-radius:10px;color:#fff;padding:.35em .75em;font-size:clamp(12px,2.1vmin,16px);font-weight:700;cursor:pointer}
.iconbtn kbd{font:inherit;opacity:.6;font-weight:400;margin-left:.3em}
.touch .iconbtn kbd{display:none}
#phoneBadge{position:absolute;top:-.55em;right:-.45em;background:#e0453a;color:#fff;border-radius:999px;font-size:.75em;min-width:1.5em;padding:0 .35em;line-height:1.5;animation:pulse 1.2s ease-in-out infinite}
#phoneBadge[hidden]{display:none}
@keyframes pulse{50%{transform:scale(1.18)}}
#toasts{position:absolute;top:2.8em;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.3em;pointer-events:none;width:92%}
.toast{background:rgba(20,28,36,.92);color:#fff;border-radius:8px;padding:.35em .8em;font-size:clamp(12px,2.2vmin,17px);border-left:4px solid var(--post);animation:tin .25s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast,#phoneBadge,#dlgMore{animation:none}}

/* dialog */
#dialog{position:absolute;left:3%;right:3%;bottom:3%;background:rgba(20,28,36,.96);color:#f4f4f0;border:2px solid var(--post);border-radius:12px;padding:.7em 1em .8em;font-size:clamp(14px,2.7vmin,21px);cursor:pointer}
#dialog[hidden]{display:none}
#dlgWho{font-family:var(--display);font-weight:800;font-size:1.05em;color:var(--post);margin-bottom:.15em}
#dlgDe{font-size:1.2em;font-weight:700;line-height:1.3}
#dlgDe .big{font-size:1.3em}
#dlgEn{color:#b8c4cf;font-style:italic;margin-top:.2em;line-height:1.35}
#dlgEn.tip{font-style:normal;color:#f4f4f0}
#dlgEn .k{display:inline-block;border:1px solid #8796a5;border-radius:4px;padding:0 .3em;font-size:.9em}
#dlgReveal{background:none;border:1px dashed #6f7f8f;border-radius:6px;color:#b8c4cf;font-size:.8em;padding:.1em .5em;margin-top:.3em;cursor:pointer}
#dlgChoices{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.6em}
#dlgChoices button{background:#2a3744;border:1px solid #57697b;border-radius:10px;padding:.4em .9em;font-size:1em;font-weight:700;cursor:pointer;color:#fff}
#dlgChoices button:hover{border-color:var(--post)}
#dlgChoices button .i,#qOpts .i{opacity:.5;font-weight:400;margin-right:.35em;font-size:.85em}
#dlgMore{position:absolute;right:.8em;bottom:.4em;font-size:.8em;color:var(--post);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

/* quiz */
#quiz{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);width:min(92%,560px);background:rgba(20,28,36,.97);color:#f4f4f0;border:2px solid var(--post);border-radius:14px;padding:.8em 1em 1em;font-size:clamp(14px,2.6vmin,20px);text-align:center}
#quiz[hidden]{display:none}
#qKicker{font-family:var(--display);font-weight:600;color:var(--post);font-size:1.15em}
#qPrompt{font-size:1.15em;margin:.35em 0 .6em;line-height:1.35}
#qPrompt .big{font-size:1.25em;font-weight:700}
.ipic{display:block;margin:0 auto .25em;width:3em;height:3em;image-rendering:pixelated}
#qOpts{display:grid;grid-template-columns:1fr 1fr;gap:.5em}
#qOpts button{background:#2a3744;border:2px solid #4c5e70;border-radius:10px;padding:.5em .4em;font-size:1.05em;font-weight:700;cursor:pointer;color:#fff;min-height:2.6em}
#qOpts button.ok{background:#1f4a2b;border-color:#7fdc8a}#qOpts button.bad{background:#4a1f22;border-color:#f06a5c}
#qFeedback{margin-top:.6em;min-height:1.3em;line-height:1.35}
#qFeedback .next{display:inline-block;margin-top:.4em;background:var(--post);color:var(--post-ink);border:0;border-radius:8px;padding:.3em 1em;font-weight:700;cursor:pointer;font-size:1em}

/* title / victory */
#title,#victory{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:1em}
#title{background:linear-gradient(180deg,rgba(48,36,92,.35),rgba(30,22,52,.9) 72%)}
#victory{background:rgba(20,28,36,.9)}
#title[hidden],#victory[hidden]{display:none}
#title h1{font-family:var(--display);font-weight:800;font-style:normal;font-size:clamp(40px,11vmin,104px);line-height:.95;margin:0;color:var(--cream);text-shadow:0 4px 0 #2a1f44,0 0 34px rgba(246,214,106,.45);letter-spacing:-.01em}
#title .sub{font-size:clamp(14px,2.8vmin,22px);margin:.45em 0 1em;color:#e3e8ec}
#title .row,#victory .row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}
.bigbtn{background:var(--post);color:var(--post-ink);border:0;border-radius:12px;padding:.55em 1.4em;font-size:clamp(15px,2.8vmin,22px);font-weight:700;cursor:pointer;font-family:var(--display)}
.bigbtn.ghost{background:transparent;color:#fff;border:2px solid #8796a5}
#title .help{margin-top:1.1em;font-size:clamp(11px,2vmin,15px);color:#c8d2da;line-height:1.5;max-width:44em}
#title .help b{color:#fff}
#title .voiceNote,#title .titleMsg{margin-top:.5em;font-size:clamp(11px,1.9vmin,14px);color:var(--post);min-height:1.2em}
#title .profiles{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;align-items:center;margin:0 0 .9em;font-size:clamp(13px,2.4vmin,18px)}
#title .who{color:#e3e8ec;margin-right:.2em}
.pchip{background:rgba(255,255,255,.08);border:1px solid #8796a5;border-radius:999px;padding:.3em .9em;cursor:pointer;font-weight:700;font-size:1em;color:#fff}
.pchip.on{background:var(--post);border-color:var(--post);color:var(--post-ink)}
.pchip.add{border-style:dashed;font-weight:400}
.pedit{display:inline-flex;gap:.3em}
.pedit input{font:inherit;font-weight:700;border-radius:999px;border:2px solid var(--post);padding:.25em .8em;width:9em;background:#141c24;color:#fff}
#victory h2{font-family:var(--display);font-weight:700;font-size:clamp(32px,7vmin,64px);margin:0;color:var(--post)}
#victory .stats{margin:.8em 0;font-size:clamp(14px,2.6vmin,20px);line-height:1.5}
#victory .tease{color:#c8d2da;font-style:italic;margin-bottom:1em;max-width:34em;font-size:clamp(13px,2.3vmin,18px)}

/* panel (shops, phone) */
#panel{position:fixed;inset:0;z-index:15;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
#panel[hidden]{display:none}
.sheet{background:var(--panel);color:var(--ink);width:min(640px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35)}
#panel.phone .sheet{width:min(420px,100%);border:10px solid #1f2329;border-radius:28px}
.sheet header{display:flex;align-items:center;gap:.8em;padding:.75em 1em;background:var(--plum);color:var(--cream)}
#panel #pClose{background:rgba(255,255,255,.14);color:var(--cream)}
#panel.phone .sheet header{background:#1f2329;color:#fff}
.sheet h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,4.5vw,28px);margin:0;flex:1;line-height:1.1}
#pClose{background:rgba(0,0,0,.12);border:0;border-radius:10px;padding:.4em .9em;font-weight:700;cursor:pointer;font-size:1em}
#panel.phone #pClose{background:rgba(255,255,255,.15)}
#pClose[hidden]{display:none}


/* die Landkarte */
#panel.landk .sheet{width:min(720px,100%);background:#fbf6e8}
#panel.landk .sheet header{background:#5a4630}
#panel.landk #pSub .en,.lkinfo .en,.lkarea .en{color:#8a8070;font-style:italic}
.lkwrap{position:relative;width:100%}
.lkmap{display:block;width:100%;aspect-ratio:320/200;image-rendering:pixelated;border-radius:10px;border:3px solid #5a4630}
.lkpins{position:absolute;inset:3px}
.lkpin{position:absolute;transform:translate(-50%,-50%);width:15%;height:16%;border:0;background:transparent;cursor:pointer;border-radius:12px}
.lkpin:hover{background:rgba(255,226,122,.18)}
.lkpin.cmp{width:7%;height:10%}
.lkpin.lock{cursor:default}
.lkinfo{text-align:center;margin:.5em 0 .2em;color:#2a2a35}
.lkarea{color:#2a2a35}
/* festival calendar + lantern crafting */
.frow{display:flex;gap:.7em;align-items:flex-start;padding:.6em .3em;border-bottom:1px solid #e6dcc4;color:#2a2a35}
.frow.act{background:#fff3cc;border-radius:10px}
.ficon{font-size:1.8em;line-height:1}
.fname{font-weight:800;font-size:1.08em}
.fwhen{color:#7a4a3a;font-weight:700;font-size:.92em}
.fen{color:#6a6458;font-size:.9em}
.fchip{font-size:.7em;font-weight:800;padding:.1em .5em;border-radius:999px;margin-left:.3em;vertical-align:middle}
.fchip.now{background:#e0503c;color:#fff}.fchip.soon{background:#ffe27a;color:#6a4a00}.fchip.later{background:#e6e0d0;color:#7a7060}.fchip.done{background:#bfe6b8;color:#2a5a2a}
.lopts{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap;margin:.5em 0}
.lopt{border:2px solid #d6cbb0;background:#fff;border-radius:12px;padding:.5em .8em;cursor:pointer;min-width:6em;color:#2a2a35;font-size:1em}
.lopt canvas{display:block;margin:0 auto .2em;image-rendering:pixelated;width:60px;height:72px}
.lopt:hover{border-color:#7a4a3a}
.lopt .sw{display:block;width:2.2em;height:2.2em;border-radius:8px;margin:0 auto .3em;border:2px solid #2f3a44}
.lprev{display:block;margin:.2em auto;width:90px;height:105px;image-rendering:pixelated}
.ch.slot{cursor:pointer;border-style:dashed}.ch.empty{background:#f6f0e0;color:#b0a890}
.lbank{display:flex;gap:.5em;justify-content:center;margin:.6em 0}
.ltile{border:0;border-radius:10px;padding:.45em .9em;font-weight:800;font-size:clamp(17px,3vmin,24px);background:#7a4a3a;color:#fff;cursor:pointer}
.songl{font-weight:700;font-size:1.1em;margin:.15em 0}
/* books */
#panel.bookp .sheet{width:min(560px,100%);background:#fbf6e8}
#panel.bookp .sheet header{background:#7a4a3a}
#panel.bookp #pSub{color:#8a6a50}
.bkby{font-style:italic}
.bk{display:flex;flex-direction:column;gap:.55em;align-items:stretch}
.bkpic{width:100%;aspect-ratio:2/1;image-rendering:pixelated;border-radius:10px;border:3px solid #2f3a44;background:#ddd}
.bkline{display:flex;flex-wrap:wrap;gap:.35em;justify-content:center;margin:.2em 0}
.ch{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:2px solid #d6cbb0;border-radius:10px;padding:.2em .55em .05em;font-size:clamp(18px,3.4vmin,26px);font-weight:700;color:#2a2a35}
.ch i{font-style:normal;font-size:.5em;font-weight:800;color:#9a8e72;line-height:1.3}
.ch.v{background:#ffe27a;border-color:#e0b43a}
.ch.v i{color:#9a6a00}
.ch.pick{cursor:pointer}
.ch.pick:hover{border-color:#7a4a3a}
.ch.no{background:#f6d0cc;border-color:#d0604c}
.bknote{background:#eef6ff;border-left:4px solid #5aaef0;padding:.45em .7em;border-radius:6px;font-size:.92em;color:#2a2a35}
.bken{color:#6a6458;text-align:center;font-style:italic}
.bken.hid{visibility:hidden}
.bknav{display:flex;gap:.4em;align-items:center;justify-content:center;flex-wrap:wrap}
.bknav button,.bkopts button,.bkgo{border:0;border-radius:10px;padding:.5em .9em;font-weight:800;font-size:1em;cursor:pointer;background:#e9e1cc;color:#2a2a35}
.bknav button.primary,.bkgo{background:#7a4a3a;color:#fff}
.bknav button:disabled{opacity:.35}
.bknum{color:#8a8070;font-weight:700;min-width:3.5em;text-align:center}
.bkq{text-align:center;color:#2a2a35}
.bkq .kick{color:#9a6a00;font-weight:800;font-size:.85em;text-transform:uppercase;letter-spacing:.04em}
.bkq h3{margin:.3em 0 .1em;font-size:clamp(20px,3.6vmin,28px)}
.bkq .en{color:#8a8070;margin-bottom:.6em}
.bkopts{display:flex;flex-direction:column;gap:.45em;max-width:22em;margin:0 auto}
.bkopts button.ok{background:#bfe6b8}
.bkopts button.no{background:#f6d0cc;opacity:.7}
.bkfb{min-height:1.6em;margin-top:.5em;font-size:1.05em}
.bkdone{text-align:center;color:#2a2a35}.bkdone .big{font-size:2em;font-weight:800;color:#7a4a3a}
.bkintro{text-align:center;color:#2a2a35}.bkintro p{margin:.5em 0}
.vtag{background:#ffe27a;padding:0 .3em;border-radius:4px}
.bkgo{display:block;margin:.7em auto 0}

#pSub{padding:.6em 1em 0;color:var(--muted);font-size:1.05em}
#pSub b{color:var(--ink)}
#pBody{overflow-y:auto;padding:.6em 1em 1.1em;-webkit-overflow-scrolling:touch;font-size:clamp(15px,2.4vmin,18px)}
.tok{cursor:pointer;border-bottom:2px dotted color-mix(in srgb,var(--muted) 60%,transparent);border-radius:2px}
.tok:hover{background:color-mix(in srgb,var(--post) 35%,transparent)}
.tokTip{position:absolute;z-index:40;background:#1f2a37;color:#fff;border-radius:8px;padding:.35em .7em;font-size:15px;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);max-width:80vw}
.tokTip b{color:var(--post)}
.memo{background:var(--panel-2);border-left:4px solid var(--post);border-radius:8px;padding:.5em .7em;margin-bottom:.7em;line-height:1.45}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.5em}
.item{display:flex;flex-direction:column;align-items:center;gap:.15em;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;padding:.5em .3em;cursor:pointer;font-size:1em}
.item:hover{border-color:var(--post)}
.item img,.chip img,.bigItem img{image-rendering:pixelated}
.item img{width:48px;height:48px}
.item .nm{font-weight:700}
.item .pr{color:var(--muted);font-size:.9em}
.basket{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;margin:.8em 0 .2em;min-height:2.4em}
.basket .lbl{font-weight:700;margin-right:.2em}
.basket i{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3em;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:.15em .6em .15em .3em;cursor:pointer;font-weight:700;font-size:.95em}
.chip img{width:24px;height:24px}.chip .x{color:var(--muted);font-weight:400;margin-left:.2em}
.prow{display:flex;align-items:center;justify-content:flex-end;gap:.6em;margin-top:.8em;flex-wrap:wrap}
.wallet{margin-right:auto;color:var(--muted)}
.wallet b{color:var(--ink)}
.primary,.ghost{border-radius:12px;padding:.5em 1.2em;font-weight:700;font-size:1.05em;cursor:pointer;font-family:var(--display)}
.primary{background:var(--post);color:var(--post-ink);border:0}
.ghost{background:transparent;border:2px solid var(--line)}
.primary:disabled,.ghost:disabled{opacity:.4;cursor:default}
.stepHead{margin-bottom:.6em;line-height:1.45}
.step{display:inline-block;background:var(--ink);color:var(--panel);border-radius:6px;padding:0 .5em;margin-right:.4em;font-weight:700;font-size:.85em}
.sline{min-height:3.2em;display:flex;flex-wrap:wrap;gap:.35em;align-items:center;padding:.5em;border:2px dashed var(--line);border-radius:12px;background:var(--panel-2)}
.sline.done{border-style:solid;border-color:var(--das)}
.sline .ph{color:var(--muted);font-style:italic}
.bank{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.7em}
.tile{background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:10px;padding:.35em .75em;font-weight:700;font-size:1.1em;cursor:pointer}
.tile.on{background:var(--post);color:var(--post-ink);border-color:#c9a100}
.hint{margin-top:.7em;background:color-mix(in srgb,var(--post) 22%,var(--panel));border-radius:10px;padding:.5em .7em;line-height:1.45}
.hint .sm{font-size:.9em;color:var(--muted)}
.said{font-size:1.15em;line-height:1.45;margin-bottom:.7em}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.coin{background:var(--panel-2);border:2px solid var(--line);border-radius:999px;padding:.6em .2em;font-weight:700;font-size:1.2em;cursor:pointer;font-family:var(--display)}
.coin.ok,.crateBtn.ok{outline:4px solid #4fd06a}
.coin.bad,.crateBtn.bad{opacity:.5}
.bigItem{display:flex;flex-direction:column;align-items:center;gap:.2em;margin:.3em 0 .8em}
.bigItem img{width:80px;height:80px}
.bigItem span{font-size:1.5em;font-weight:700}
.crateBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em}
.crateBtn{border:0;border-radius:12px;padding:.8em .2em;font-size:1.35em;font-weight:700;color:#fff;cursor:pointer;font-family:var(--display);border-bottom:6px solid rgba(0,0,0,.25)}
.crateBtn.der{background:#2f7fc8}.crateBtn.die{background:#c8392d}.crateBtn.das{background:#2f8f3c}
.crateBtn .i{opacity:.6;font-size:.6em;margin-right:.3em}
.msg{background:var(--panel-2);border-radius:14px 14px 14px 4px;padding:.6em .8em;margin-bottom:.6em;line-height:1.5}
.msg.new{box-shadow:0 0 0 2px var(--post)}
.msg .from{font-weight:700;font-size:.9em;color:var(--muted);margin-bottom:.15em}
.msg .dot{background:#e0453a;color:#fff;border-radius:999px;padding:0 .45em;font-size:.8em}
.msg .txt{font-size:1.1em}
.msgBtns{display:flex;gap:.4em;margin-top:.4em;flex-wrap:wrap}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.15em .7em;font-size:.85em;cursor:pointer}
.msg .en{color:var(--muted);font-style:italic;margin-top:.3em}
.empty{color:var(--muted);text-align:center;padding:2em}

/* journal */
#journal{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top,0px)) 10px max(10px,env(safe-area-inset-bottom,0px))}
#journal[hidden]{display:none}
.book{background:var(--panel);color:var(--ink);width:min(760px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.book header{display:flex;align-items:center;gap:.6em;padding:.75em 1em;background:var(--plum);color:var(--cream)}
.book h2{font-family:var(--display);font-weight:700;font-size:clamp(22px,4.5vw,32px);margin:0;flex:1}
.book .close,.book .practice{border:0;border-radius:10px;padding:.4em .9em;font-weight:700;cursor:pointer;font-size:1em}
.book .close{background:rgba(255,255,255,.14);color:var(--cream)}
.book .practice{background:var(--post);color:var(--post-ink)}
.book .meta{padding:.6em 1em 0;color:var(--muted)}
.jbody{overflow-y:auto;padding:.2em 1em 1.2em;-webkit-overflow-scrolling:touch}
.legend{display:flex;gap:1em;flex-wrap:wrap;margin:.6em 0 0}
.cat h3{margin:1em 0 .3em;font-size:1.15em;display:flex;align-items:baseline;gap:.5em;font-family:var(--display);font-weight:600}
.cat h3 .en{font-weight:400;color:var(--muted);font-size:.8em;font-family:var(--body)}
.cat h3 .cnt{margin-left:auto;font-weight:400;color:var(--muted);font-size:.8em;font-family:var(--body)}
.w{display:grid;grid-template-columns:2.2em 1.3fr 1fr auto;align-items:center;gap:.5em;padding:.35em 0;border-top:1px solid var(--line)}
.w .say{background:var(--panel-2);border:1px solid var(--line);border-radius:50%;width:2em;height:2em;cursor:pointer;font-size:.95em;line-height:1}
.w .de{font-weight:700;font-size:1.08em;display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.w .de .ipic{display:inline-block;margin:0;width:1.6em;height:1.6em}
.w .pl{font-weight:400;color:var(--muted);font-size:.85em}
.w .en{color:var(--muted)}
.w .stars{color:#d4a300;font-size:.9em;letter-spacing:.05em}
.w .stars .off{color:var(--line)}
.w.seen .de{opacity:.65}
.w.locked .de{color:var(--line);letter-spacing:.2em}
.w.locked .en{font-style:italic;font-size:.9em}
.settings{display:flex;flex-direction:column;gap:.45em;padding:.8em 0 0;border-top:1px solid var(--line);margin-top:1em;color:var(--muted)}
.settings label{display:flex;align-items:center;gap:.45em;cursor:pointer}

/* touch */
#touch{display:none;width:100%;justify-content:space-between;align-items:center;padding:8px 18px;gap:10px}
.touch #touch{display:flex}
.touch.landscape #touch{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);pointer-events:none;padding:10px 22px}
.touch.landscape #touch>*{pointer-events:auto}
.touch.portrait #touch{flex:1}
.touch.portrait #stage{border-radius:0;box-shadow:none}
.touch.portrait #app{justify-content:flex-start}
#dpad{position:relative;width:150px;height:150px;flex:none;touch-action:none}
#dpad button{position:absolute;width:52px;height:52px;border-radius:14px;background:rgba(31,42,55,.88);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:20px;touch-action:none}
#dpad [data-k=up]{left:49px;top:0}#dpad [data-k=down]{left:49px;bottom:0}#dpad [data-k=left]{left:0;top:49px}#dpad [data-k=right]{right:0;top:49px}
#dpad button.on,#actBtn.on{filter:brightness(1.35)}
#actBtn{width:92px;height:92px;border-radius:50%;background:var(--post);color:var(--post-ink);border:3px solid rgba(0,0,0,.2);font-weight:700;font-size:18px;font-family:var(--display);touch-action:none;flex:none}
.touch.landscape #hudBtns{top:.5em;bottom:auto;right:50%;transform:translateX(50%)}
.touch.landscape #objective{top:auto;bottom:.6em;left:50%;transform:translateX(-50%);max-width:46%}
.touch.portrait #objective{top:4.6em;bottom:auto;max-width:80%}
.touch.portrait #dialog,.touch.portrait #quiz{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:10;font-size:16px;transform:none;width:auto}
.touch.landscape #dialog,.touch.landscape #quiz{left:190px;right:140px;width:auto;transform:none;bottom:12px}
#dialog{background:rgba(34,26,56,.96);border-color:#e7c46a}
#quiz{background:rgba(34,26,56,.97);border-color:#e7c46a}
.recipe{background:#f6ead0;color:#3a2a1a;border-radius:10px;padding:.8em 1em;margin-bottom:.8em;box-shadow:inset 0 0 0 2px #e2cfa4,inset 0 0 30px rgba(140,100,40,.18);font-size:1.1em;line-height:1.5}
.recipe .rtitle{font-family:var(--display);font-weight:800;font-size:1.35em;color:#5a2e6a;margin-bottom:.2em}
.recipe .tok{border-bottom-color:rgba(90,46,106,.4)}
.recipe .mini{background:#fffaf0;border-color:#e2cfa4;color:#3a2a1a}
.recipe .en{color:#6a5a40;font-style:italic;margin-top:.3em}
.pot{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;min-height:2.6em;padding:.5em;border-radius:999px;background:radial-gradient(ellipse at 50% 30%,#4a3a5a,#241c2e);color:#e8dcf8;margin-bottom:.7em;justify-content:center}
.pot .chip{background:#5e4a78;border-color:#7a62a0;color:#fff}
.spellBtns{display:flex;gap:.5em;flex-wrap:wrap}
.spellBtns .i{opacity:.55;font-size:.8em;margin-right:.3em}
#btnBroom[hidden]{display:none}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" aria-label="Lindendorf"></canvas>
    <div id="hud">
      <div id="hudLeft"><div id="money">20 €</div><div id="crates"></div></div>
      <div id="nameCount"></div>
    </div>
    <div id="objective"></div>
    <div id="prompt" hidden></div>
    <div id="hudBtns">
      <button class="iconbtn" id="btnPhone">📱 Handy<kbd>H</kbd><span id="phoneBadge" hidden>1</span></button>
      <button class="iconbtn" id="btnBroom" hidden>🧹 Fliegen<kbd>F</kbd></button>
      <button class="iconbtn" id="btnMap">🗺️ Karte<kbd>M</kbd></button><button class="iconbtn" id="btnBook">Buch<kbd>B</kbd></button>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="dialog" hidden><div id="dlgWho"></div><div id="dlgDe"></div><div id="dlgEn"></div><button id="dlgReveal" hidden>Show English</button><div id="dlgChoices"></div><div id="dlgMore">weiter ▾</div></div>
    <div id="quiz" hidden><div id="qKicker"></div><div id="qPrompt"></div><div id="qOpts"></div><div id="qFeedback"></div></div>
    <div id="victory" hidden></div>
    <div id="title">
      <h1>Hexenpost</h1>
      <div class="sub">Deliveries by broom in Lindendorf, a game in German</div>
      <div class="profiles" id="profiles"></div>
      <div class="row" id="titleBtns"></div>
      <div class="titleMsg" id="titleMsg" aria-live="polite"></div>
      <div class="help" id="titleHelp"></div>
      <div class="voiceNote" id="voiceNote"></div>
    </div>
  </div>
  <div id="touch">
    <div id="dpad"><button data-k="up" aria-label="Up">▲</button><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button><button data-k="down" aria-label="Down">▼</button></div>
    <button id="actBtn">Talk</button>
  </div>
</div>
<div id="panel" hidden><div class="sheet" role="dialog"><header><h2 id="pTitle"></h2><button id="pClose">Schließen</button></header><div id="pSub"></div><div id="pBody"></div></div></div>
<div id="journal" hidden>
  <div class="book" role="dialog" aria-label="Mein Wörterbuch">
    <header><h2>Mein Wörterbuch</h2><button class="practice" id="jPractice">Üben</button><button class="practice" id="jFeste">📅 Feste</button><button class="close" id="jClose">Close</button></header>
    <div class="meta" id="jMeta"></div>
    <div class="jbody" id="jBody"></div>
  </div>
</div>

const gainCd={};
function rec(id){return S.words[id]||(S.words[id]={m:0,seen:false,last:0});}
function learn(id,delta,force){
  const w=W[id]; if(!w) return; const r=rec(id), now=Date.now();
  if(!r.seen){ r.seen=true; toast(`New word: <b>${deHTML(w)}</b> <span style="opacity:.75">${esc(w.en)}</span>`); sfx('learn'); }
  if(delta>0){ if(force||!gainCd[id]||now-gainCd[id]>20000){ r.m=Math.min(5,r.m+delta); gainCd[id]=now; } }
  else if(delta<0) r.m=Math.max(0,r.m+delta);
  r.last=now; markDirty(); updateHUD();
}
const known=()=>VOCAB.filter(w=>(S.words[w.id]||{}).m>0).length;
function pickDue(exclude){
  const now=Date.now();
  const pool=VOCAB.filter(w=>S.words[w.id]&&S.words[w.id].seen&&w.id!==exclude);
  if(!pool.length) return null;
  const sc=w=>{const r=S.words[w.id];return r.m*3-(now-r.last)/60000;};
  pool.sort((a,b)=>sc(a)-sc(b));
  return pick(pool.slice(0,Math.min(4,pool.length))).id;
}
function enHTML(v){ if(v.cat==='zahlen') return `<b>${v.n}</b>`; return esc(v.en); }
function picHTML(v){ return PICS.has(v.id)?`<img class="ipic" alt="" src="${pic(v.id)}">`:''; }
function makeQuiz(id,kicker){
  const w=W[id], r=rec(id);
  let pool=shuffle(VOCAB.filter(v=>v.cat===w.cat&&v.id!==w.id));
  if(pool.length<3) pool=pool.concat(shuffle(VOCAB.filter(v=>v.cat!==w.cat&&v.cat!=='zahlen')));
  const mode=(r.m<2||rand()<.4)?'de2en':'en2de';
  let p, opts, sayP=null;
  if(mode==='de2en'){ p=`${picHTML(w)}What does <span class="big">${deHTML(w)}</span> mean?`; sayP=deText(w); opts=[w,...pool.slice(0,3)].map(v=>({html:enHTML(v),ok:v===w})); }
  else { p=`${picHTML(w)}Which one means <span class="big">${enHTML(w)}</span>?`; opts=[w,...pool.slice(0,3)].map(v=>({html:deHTML(v),ok:v===w})); }
  shuffle(opts);
  return {word:id,kicker:kicker||'Quick!',prompt:p,opts,say:sayP,answer:`<b>${deHTML(w)}</b> means <b>${enHTML(w)}</b>`,answerSay:deText(w)};
}

function sentenceHint(words,need){

  if(words[1]!=='möchte') return 'In German the verb comes <b>second</b>: <b>Ich möchte</b> …';
  if(words.includes('du')) return 'You are talking about yourself, so you don\'t need <b>du</b>.';
  for(const [id,n] of need){ if(n!==1) continue; const w=W[id], i=words.indexOf(w.de); if(i>0&&words[i-1]!==ACC[w.art]){
      return w.art==='der'?`<b>der ${w.de}</b> → <b>einen ${w.de}</b>. After <i>möchte</i>, der-words change: <b>ein</b> becomes <b>einen</b>.`:`<b>${w.art} ${w.de}</b> → <b>${ACC[w.art]} ${w.de}</b>. Only der-words change to <b>einen</b>.`; } }

async function letterHigh(L){

async function grabLetter(L){
  sfx('pick'); burst(L.x,L.y,'#fff6c8',16); learn('brief',1,true);

function drawLetters(){
  lettersHere().forEach((L,i)=>{
    const bob=Math.round(Math.sin(time*2.4+i)*2), x=Math.round(L.x), y=Math.round(L.y)+bob, flap=Math.floor(time*6+i)%2;
    if(player.flying) glow(x,y-3,14,.35,'255,240,180');
    ctx.fillStyle='rgba(47,58,68,.25)'; ctx.fillRect(x-5,y+3,10,2);
    ctx.fillStyle='#2f3a44'; ctx.fillRect(x-6,y-8,12,9);
    ctx.fillStyle='#faf4e2'; ctx.fillRect(x-5,y-7,10,7);
    ctx.fillStyle='#c8b894'; for(let k=0;k<4;k++){ ctx.fillRect(x-5+k,y-7+k,1,1); ctx.fillRect(x+4-k,y-7+k,1,1); }
    ctx.fillStyle='#d0604c'; ctx.fillRect(x-1,y-4,2,2);
    ctx.fillStyle='#ffffff'; if(flap){ ctx.fillRect(x-9,y-9,3,2); ctx.fillRect(x+6,y-9,3,2); } else { ctx.fillRect(x-9,y-5,3,2); ctx.fillRect(x+6,y-5,3,2); }
  });
}

];
const FEST_BY={}; FESTS.forEach(f=>FEST_BY[f.id]=f);
function festDate(f,year){ if(f.movable){ const v=f.movable[year]; return v?new Date(year,v[0]-1,v[1]):null; } return new Date(year,f.m-1,f.d); }
function nextFestDate(f){ const now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate()); for(const y of [now.getFullYear(),now.getFullYear()+1,now.getFullYear()+2]){ const d=festDate(f,y); if(d&&d>=t0) return d; } return null; }
function inWindow(f){
  if(!f.from) return false; const now=new Date(), md=(now.getMonth()+1)*100+now.getDate(), a=f.from[0]*100+f.from[1], b=f.to[0]*100+f.to[1];
  return a<=b?(md>=a&&md<=b):(md>=a||md<=b);
}
function festActive(id){ if(!S) return false; if(S.festOverride) return S.festOverride===id;
  if(id==='martin'&&S.martin&&S.martin.step>=1&&S.martin.step<4) return true;   // a started quest stays open until it is finished
  const f=FEST_BY[id]; return !!(f&&f.ready&&inWindow(f)); }
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function openFestKalender(){ return new Promise(res=>{
  const close=()=>{ closePanel(); res(); };
  openPanel('Der Festkalender','German festivals through the year. The game follows the real calendar.','Schließen',close,'bookp');
  const now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const rows=FESTS.map(f=>({f,d:nextFestDate(f)})).sort((a,b)=>(a.d||9e15)-(b.d||9e15));
  rows.forEach(({f,d})=>{
    const days=d?Math.round((d-t0)/864e5):null, act=festActive(f.id), done=S.fests&&S.fests[f.id];
    const chip=done?'<span class="fchip done">✓ Gefeiert!</span>':act?'<span class="fchip now">Jetzt!</span>':f.ready?'<span class="fchip soon">Bald</span>':'<span class="fchip later">Coming to the game</span>';
    const when=d?`${d.getDate()}. ${MONTHS[d.getMonth()]}${days===0?' · heute!':days===1?' · morgen':` · in ${days} Tagen`}`:'';
    pBody.appendChild(el('div','frow'+(act?' act':''),`<div class="ficon">${f.icon}</div><div class="fmain"><div class="fname">${esc(f.de)} ${chip}</div><div class="fwhen">${esc(when)}</div><div class="fen">${esc(f.en)}</div></div>`));
  });
  speak('der Festkalender');
}); }

const LCOL={rot:'#e0503c',blau:'#4a78d8',gelb:'#f0c840','grün':'#4aa860'};
function drawLantern(g,x,y,shape,col,sc,lit){
  sc=sc||1; const w=10*sc, h=12*sc;
  g.fillStyle='#8a6244'; g.fillRect(x-sc/2,y-h/2-6*sc,Math.max(1,sc),6*sc);
  g.fillStyle='#3c3c4c'; g.fillRect(x-w/2,y-h/2-sc,w,Math.max(1,sc)); g.fillRect(x-w/2,y+h/2,w,Math.max(1,sc));
  g.fillStyle=col; g.fillRect(x-w/2,y-h/2,w,h);
  g.fillStyle=lit?'#fff2a0':'rgba(255,255,255,.55)';
  const cx=x, cy=y;
  if(shape==='sonne'){ g.beginPath(); g.arc(cx,cy,2.4*sc,0,6.283); g.fill(); for(let i=0;i<8;i++){ const a=i/8*6.283; g.fillRect(Math.round(cx+Math.cos(a)*3.6*sc-sc/2),Math.round(cy+Math.sin(a)*3.6*sc-sc/2),Math.max(1,sc),Math.max(1,sc)); } }
  else if(shape==='mond'){ g.beginPath(); g.arc(cx,cy,3.2*sc,0,6.283); g.fill(); g.fillStyle=col; g.beginPath(); g.arc(cx+1.6*sc,cy-.8*sc,2.8*sc,0,6.283); g.fill(); }
  else { g.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i/10*6.283, r=(i%2?1.5:3.8)*sc; g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r); } g.closePath(); g.fill(); }
}

/* ================= LICHT: WebGL lighting pass =================
   The game draws the world twice into small offscreen canvases:
     acv = albedo (exactly what it drew before)
     ncv = normals (same draw calls, but every image swapped for its normal map; R,G = normal x/y, B = emissive)
   A tiny WebGL shader lights acv with ncv and draws the result under the 2D UI canvas.
   Everything visual about time of day and weather goes through ONE state object (Lite.env),
   so a day/night cycle and weather only have to change env values later. */
const Lite=(()=>{
  const MAXL=32;
  let gl=null, glcv=null, prog=null, U={}, texA=null, texN=null, ok=null, lights=[], inNormal=false, shown=false;
  const acv=document.createElement('canvas'), ncv=document.createElement('canvas');
  const actx=acv.getContext('2d'), nctx=ncv.getContext('2d');
  const nmapC=document.createElement('canvas'), nm=nmapC.getContext('2d');
  const NMAP=new WeakMap(); let ARTKEY=null;
  // ---------- environment: the single place time-of-day and weather will drive ----------
  const ENV={
    day:  {amb:[.50,.50,.53], sun:[.60,.57,.48], dir:[-.50,.32,.80], emis:0},
    dusk: {amb:[.58,.48,.44], sun:[.78,.50,.28], dir:[-.85,.15,.45], emis:.6},
    night:{amb:[.17,.19,.34], sun:[.10,.12,.22], dir:[.30,-.40,.85], emis:1},
  };
  const env={night:0, amb:[1,1,1], sun:[0,0,0], dir:[0,0,1], emis:0, weather:{tint:[1,1,1], dim:0}};
  const mix3=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  function setNight(n){
    env.night=n; const A=n<.5?ENV.day:ENV.dusk, B=n<.5?ENV.dusk:ENV.night, t=n<.5?n*2:(n-.5)*2;
    env.amb=mix3(A.amb,B.amb,t); env.sun=mix3(A.sun,B.sun,t); env.dir=mix3(A.dir,B.dir,t); env.emis=A.emis+(B.emis-A.emis)*t;
    const w=env.weather; env.amb=env.amb.map((v,i)=>v*w.tint[i]*(1-w.dim)); env.sun=env.sun.map(v=>v*(1-w.dim*1.5));
  }
  const TOD={auto:null, morgen:.22, mittag:0, abend:.55, nacht:1};
  function nightLevel(fallback){
    const pv=TOD[(settings&&settings.tod)||'auto']; if(pv!=null) return pv;
    return Math.max(fallback||0, evening?1:0);
  }
  // ---------- WebGL ----------
  const VS='attribute vec2 p; varying vec2 uv; void main(){ uv=vec2(p.x*.5+.5,.5-p.y*.5); gl_Position=vec4(p,0.,1.); }';
  const FS=`precision mediump float;
    uniform sampler2D A,N; uniform vec2 res; uniform vec3 amb,sunC,sunD,emC; uniform float emA;
    uniform int nL; uniform vec4 Lp[${MAXL}]; uniform vec3 Lc[${MAXL}];
    varying vec2 uv;
    void main(){
      vec2 px=floor(uv*res)+.5; vec2 tuv=px/res;
      vec4 a=texture2D(A,tuv); vec4 q=texture2D(N,tuv);
      vec2 nxy=q.rg*2.-1.; vec3 n=normalize(vec3(nxy,sqrt(max(.05,1.-dot(nxy,nxy)))));
      vec3 li=amb+sunC*max(dot(n,normalize(sunD)),0.);
      for(int i=0;i<${MAXL};i++){ if(i>=nL) break;
        vec2 d=Lp[i].xy-px; float r=Lp[i].z; float t=clamp(1.-length(d)/r,0.,1.);
        vec3 L=normalize(vec3(d,Lp[i].w)); li+=Lc[i]*t*t*(.3+.7*max(dot(n,L),0.)); }
      vec3 col=a.rgb*li+mix(a.rgb,emC,.65)*(q.b*emA*.95);
      gl_FragColor=vec4(col,1.);
    }`;
  function sh(type,src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function tex(){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t); [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST)); [gl.TEXTURE_WRAP_S,gl.TEXTURE_WRAP_T].forEach(k=>gl.texParameteri(gl.TEXTURE_2D,k,gl.CLAMP_TO_EDGE)); return t; }
  function init(){
    if(ok!==null) return ok;
    try{
      glcv=document.createElement('canvas'); glcv.id='glcv';
      gl=glcv.getContext('webgl',{antialias:false,premultipliedAlpha:false,preserveDrawingBuffer:true});
      if(!gl) return ok=false;
      prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS)); gl.linkProgram(prog);
      if(!gl.getProgramParameter(prog,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
      const loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
      ['A','N','res','amb','sunC','sunD','emC','emA','nL','Lp','Lc'].forEach(k=>U[k]=gl.getUniformLocation(prog,k));
      texA=tex(); texN=tex(); gl.uniform1i(U.A,0); gl.uniform1i(U.N,1);
      stage.insertBefore(glcv,cv); ok=true;
    }catch(e){ console.warn('Licht disabled:',e); ok=false; }
    return ok;
  }
  // ---------- normal maps, generated from the art itself ----------
  const GLASS=new Set(['61,90,115','111,149,173','169,212,220','212,238,242','127,178,190','74,112,192','200,80,80','232,192,80','80,160,96']);
  function inTri(x,y,ax,ay,bx,by,cx_,cy_){ const s=(ax-cx_)*(y-cy_)-(ay-cy_)*(x-cx_), t=(bx-ax)*(y-ay)-(by-ay)*(x-ax); if((s<0)!==(t<0)&&s!==0&&t!==0) return false; const d=(cx_-bx)*(y-by)-(cy_-by)*(x-bx); return d===0||(d<0)===(s+t<=0); }
  function genN(img,kind,geo){
    const w=img.width, h=img.height, c=document.createElement('canvas'); c.width=w; c.height=h;
    const g=c.getContext('2d'); g.drawImage(img,0,0); const d=g.getImageData(0,0,w,h), p=d.data, N=w*h;
    const A=new Uint8Array(N), L=new Float32Array(N), D=new Uint8Array(N), H=new Float32Array(N);
    for(let i=0;i<N;i++){ A[i]=p[i*4+3]>8?1:0; L[i]=(p[i*4]*.3+p[i*4+1]*.59+p[i*4+2]*.11)/255; D[i]=A[i]?9:0; }
    const ground=kind==='ground';
    if(!ground){ for(let pass=1;pass<=3;pass++){ for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const i=y*w+x; if(D[i]!==9) continue;
      const nb=(xx,yy)=>(xx<0||yy<0||xx>=w||yy>=h)?0:D[yy*w+xx];
      if(nb(x-1,y)===pass-1||nb(x+1,y)===pass-1||nb(x,y-1)===pass-1||nb(x,y+1)===pass-1) D[i]=pass; } }
      for(let i=0;i<N;i++) if(D[i]===9) D[i]=4; }
    for(let i=0;i<N;i++) H[i]=ground?L[i]*1.6:(A[i]?(D[i]/4)*1.6+L[i]*.55:0);
    const out=g.createImageData(w,h), o=out.data;
    const big=!ground&&(w>60||h>60);
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const i=y*w+x; if(!A[i]){ o[i*4+3]=0; continue; }
      const hh=(xx,yy)=>{ xx=Math.max(0,Math.min(w-1,xx)); yy=Math.max(0,Math.min(h-1,yy)); return H[yy*w+xx]; };
      let nx=(hh(x-1,y)-hh(x+1,y))*(big?.5:1), ny=(hh(x,y-1)-hh(x,y+1))*(big?.5:1);
      if(geo){
        if(y<geo.wt){ const gable=!geo.flat&&geo.apex!=null&&inTri(x+.5,y+.5,geo.cx,geo.apex,10,geo.wt+1,w-10,geo.wt+1);
          if(gable) ny+=.45; else if(geo.flat) ny-=.15; else { nx+=x<geo.cx?-.55:.55; ny-=.35; } }
        else ny+=.45;
      }
      const len=Math.hypot(nx,ny,1); nx/=len; ny/=len;
      const glass=kind==='bld'&&GLASS.has(p[i*4]+','+p[i*4+1]+','+p[i*4+2]);
      o[i*4]=Math.round((nx*.5+.5)*255); o[i*4+1]=Math.round((ny*.5+.5)*255); o[i*4+2]=glass?255:0; o[i*4+3]=255;
    }
    g.putImageData(out,0,0); return c;
  }
  function flatOf(img){ const c=document.createElement('canvas'); c.width=img.width||1; c.height=img.height||1; const g=c.getContext('2d'); g.drawImage(img,0,0); g.globalCompositeOperation='source-in'; g.fillStyle='rgb(128,128,0)'; g.fillRect(0,0,c.width,c.height); return c; }
  function normOf(img){
    if(!img) return null; if(img===mapC) return nmapC;
    let n=NMAP.get(img); if(n) return n;
    if(!ARTKEY){ ARTKEY=new Map(); for(const k in ART) ARTKEY.set(ART[k],k); }
    const key=ARTKEY.get(img);
    if(key&&!key.startsWith('int_')){ const bid=key.startsWith('bld_')?key.slice(4):null, geo=bid&&SMETA.buildings[bid]&&SMETA.buildings[bid].geo;
      n=genN(img,key.startsWith('ground_')?'ground':bid?'bld':'sprite',geo); }
    else n=flatOf(img);
    NMAP.set(img,n); return n;
  }
  function mapRendered(){
    if(!artReady) return; nmapC.width=mapC.width; nmapC.height=mapC.height; nm.clearRect(0,0,nmapC.width,nmapC.height);
    const gimg=ART['ground_'+S.scene]; if(gimg) nm.drawImage(normOf(gimg),0,0);
    sceneObjs().forEach(o=>{ if(o.flat&&ART[o.n]) nm.drawImage(normOf(ART[o.n]),0,0,o.w,o.h,o.x,o.y,o.w,o.h); });
  }
  // ---------- the normal-pass context: same API, but colours become "flat surface" ----------
  function makeProxy(n){
    const st={emissive:0, lighter:false}, BOUND=new Map();
    const flat=()=>st.emissive?'rgb(128,128,255)':'rgb(128,128,0)';
    return new Proxy({},{
      get(_,k){
        if(k==='emissive') return st.emissive; if(k==='isN') return true;
        if(k==='drawImage') return (img,...a)=>{ if(st.lighter) return; const ni=normOf(img); if(ni) n.drawImage(ni,...a); };
        if(k==='fillRect') return (...a)=>{ if(st.lighter) return; n.fillStyle=flat(); n.fillRect(...a); };
        if(k==='fill') return (...a)=>{ if(st.lighter) return; n.fillStyle=flat(); n.fill(...a); };
        if(k==='fillText'||k==='strokeText'||k==='stroke'||k==='strokeRect') return ()=>{};
        const v=n[k]; if(typeof v!=='function') return v; let f=BOUND.get(k); if(!f){ f=v.bind(n); BOUND.set(k,f); } return f;
      },
      set(_,k,v){
        if(k==='emissive'){ st.emissive=v; return true; }
        if(k==='fillStyle'||k==='strokeStyle') return true;
        if(k==='globalCompositeOperation'){ st.lighter=(v==='lighter'); n.globalCompositeOperation='source-over'; return true; }
        n[k]=v; return true;
      }});
  }
  const nproxy=makeProxy(nctx);
  // ---------- lights ----------
  function add(x,y,r,col,amt,z){ if(inNormal||!(amt>0.01)) return; lights.push({x,y,r,col:col.map(v=>v*amt),z:z||14}); }
  function sceneLights(vw,vh){
    const n=env.night; if(n<=.05) return;
    sceneObjs().forEach(o=>{ if(o.n==='p_lamp') add(o.x+o.w/2,o.y+5,70,[1,.74,.42],1.25*n,22); });
    add(player.x,player.y-player.alt-10,46,[.55,.5,.42],.8*n,18);
  }
  // ---------- per-frame API ----------
  let LITnow=false;
  return {
    get actx(){ return actx; }, nproxy, env, add, mapRendered,
    on(){ return settings.light!==false&&artReady&&!inside&&init(); },
    lit(){ return LITnow; },
    begin(vw,vh){
      if(acv.width!==vw||acv.height!==vh){ acv.width=ncv.width=vw; acv.height=ncv.height=vh; }
      if(this._mv!==mapVer){ this._mv=mapVer; mapRendered(); }
      LITnow=true; lights=[]; setNight(nightLevel(nightAmt())); sceneLights(vw,vh);
    },
    normalPass(){ inNormal=true; nctx.setTransform(1,0,0,1,0,0); nctx.globalAlpha=1; nctx.fillStyle='rgb(128,128,0)'; nctx.fillRect(0,0,ncv.width,ncv.height); },
    endPass(){ inNormal=false; },
    render(vw,vh){
      if(glcv.width!==cv.width||glcv.height!==cv.height){ glcv.width=cv.width; glcv.height=cv.height; }
      if(!shown){ glcv.style.display='block'; shown=true; }
      gl.viewport(0,0,glcv.width,glcv.height);
      gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,texA); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,acv);
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,texN); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,ncv);
      gl.uniform2f(U.res,vw,vh); gl.uniform3fv(U.amb,env.amb); gl.uniform3fv(U.sunC,env.sun); gl.uniform3fv(U.sunD,env.dir);
      gl.uniform3fv(U.emC,[1,.72,.38]); gl.uniform1f(U.emA,env.emis);
      const cxv=camX+vw/2, cyv=camY+vh/2;
      const Ls=lights.filter(l=>Math.abs(l.x-cxv)<vw/2+l.r&&Math.abs(l.y-cyv)<vh/2+l.r).slice(0,MAXL);
      const lp=new Float32Array(MAXL*4), lc=new Float32Array(MAXL*3);
      Ls.forEach((l,i)=>{ lp.set([l.x-camX,l.y-camY,l.r,l.z],i*4); lc.set(l.col,i*3); });
      gl.uniform1i(U.nL,Ls.length); gl.uniform4fv(U.Lp,lp); gl.uniform3fv(U.Lc,lc);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4); LITnow=false;
    },
    hide(){ if(shown&&glcv){ glcv.style.display='none'; shown=false; } LITnow=false; ctx=uictx; },
  };
})();

/* ================= DIE LANDKARTE: travel between places =================
   Every edge of an area opens the map. The first 3 trips to a place, the child BUILDS the trip
   sentence (verb in place 2 + the right "where to" phrase); after that it is shown and read aloud. */
const LK=(ART_META&&ART_META.landkarte)||{places:{},paths:{}};
const PLACE={
  town:{de:'Lindendorf',phrase:'nach Lindendorf.',wrong:'in die Lindendorf.',dir:'Lindendorf liegt in der Mitte.',dirEn:'Lindendorf is in the middle.',
        rule:'Town and city names use <b>nach</b>: nach Lindendorf, nach Berlin, nach Hause.', spawn:{wald:[44.2,15.6,'left'],markt:[23.5,2.6,'down'],_:[29.5,14.6,'down']}},
  markt:{de:'Die Altstadt',phrase:'in die Altstadt.',wrong:'in den Altstadt.',dir:'Die Altstadt liegt im Norden.',dirEn:'The old town is in the north.',
        rule:'<b>die</b> Altstadt → <b>in die</b> Altstadt. Going <i>into</i> a place keeps its article: die → die.', spawn:{_:[23.5,29.2,'up']}},
  wald:{de:'Der Zauberwald',phrase:'in den Zauberwald.',wrong:'nach Zauberwald.',dir:'Der Zauberwald liegt im Osten.',dirEn:'The enchanted forest is in the east.',
        rule:'<b>der</b> Wald → <b>in den</b> Wald. Going <i>into</i> it, der becomes <b>den</b>.', spawn:{_:[4,15.6,'right']}},
  bauernhof:{de:'Der Bauernhof',locked:true}, see:{de:'Der See',locked:true}, brocken:{de:'Der Brocken',locked:true},
};
const COMPASS=[['N','Norden','north',30,13],['O','Osten','east',53,40],['S','Süden','south',30,63],['W','Westen','west',7,40]];
function mapPath(a,b){
  const P=LK.paths||{}; const get=(x,y)=>P[x+'-'+y]||(P[y+'-'+x]?P[y+'-'+x].slice().reverse():null);
  return get(a,b)||((a!=='town'&&b!=='town')?[...(get(a,'town')||[]),...(get('town',b)||[]).slice(1)]:[LK.places[a],LK.places[b]]);
}
function mapGoalScene(){ const t=(typeof festTarget==='function'&&festTarget())||rawTarget(); return t&&(t.sc||'town'); }
let mapOpen=false, pendingDest=null;
function openMap(fromEdge){
  if(mapOpen||busy||inside) return;
  if(evening){ toast('Der Laternenumzug! Stay with Sankt Martin.',2000); return; }
  mapOpen=true; held.clear(); player.vx=player.vy=0; player.moving=false;
  runScript(()=>mapScreen(fromEdge)).then(()=>{ mapOpen=false; if(pendingDest){ const d=pendingDest; pendingDest=null; arrive(d); } });
}
function mapScreen(fromEdge){ return new Promise(res=>{
  learn('landkarte',0);
  const here=S.scene, goal=mapGoalScene();
  let anim=null, done=false;
  const close=()=>{ if(done) return; done=true; if(anim) cancelAnimationFrame(anim); closePanel(); res(); };
  openPanel('Die Landkarte','Wohin? <span class="en">(Where to?)</span> Tap a place.','Zurück',close,'landk');
  const wrap=el('div','lkwrap'); const cvs=document.createElement('canvas'); cvs.width=320; cvs.height=200; cvs.className='lkmap'; wrap.appendChild(cvs);
  const g=cvs.getContext('2d'); g.imageSmoothingEnabled=false;
  let walker=null;
  const draw=()=>{
    g.clearRect(0,0,320,200); if(ART.map_region) g.drawImage(ART.map_region,0,0);
    g.font='bold 9px monospace'; g.textAlign='center'; g.fillStyle='#5a4630';
    COMPASS.forEach(([l,,,x,y])=>g.fillText(l,x,y));
    Object.entries(PLACE).forEach(([id,P])=>{ const p=LK.places[id]; if(!p) return;
      const [x,y]=p; const isHere=id===here;
      g.font='bold 8px sans-serif'; const label=P.de+(P.locked?' 🔒':''); const w=g.measureText(label).width+6;
      g.fillStyle=P.locked?'rgba(240,230,205,.75)':isHere?'#ffe27a':'rgba(255,250,235,.95)'; g.fillRect(Math.round(x-w/2),y+3,Math.round(w),11);
      g.fillStyle=P.locked?'#9a8a6a':'#3a2a1a'; g.fillText(label,x,y+11);
      if(id===goal&&id!==here){ const b=Math.abs(Math.sin(time*4))*3; g.fillStyle='#ffd84a'; g.strokeStyle='#5a4630'; g.lineWidth=1; g.beginPath(); g.moveTo(x-5,y-16-b); g.lineTo(x+5,y-16-b); g.lineTo(x,y-9-b); g.closePath(); g.fill(); g.stroke(); }
    });
    const hp=LK.places[here];
    if(hp&&!walker){ const pulse=2+Math.abs(Math.sin(time*3))*2; g.strokeStyle='#d0604c'; g.lineWidth=1.5; g.beginPath(); g.arc(hp[0],hp[1]-4,6+pulse,0,6.283); g.stroke(); }
    const im=player.flying?ART.witch_fly:ART.witch_walk, pos=walker?walker.pos:(hp?[hp[0],hp[1]-4]:null);
    if(im&&pos){ if(player.flying) g.drawImage(im,0,0,36,34,Math.round(pos[0]-12),Math.round(pos[1]-18),24,22); else g.drawImage(im,0,0,20,33,Math.round(pos[0]-6),Math.round(pos[1]-16),12,20); }
  };
  const loop=()=>{ if(done) return; draw(); anim=requestAnimationFrame(loop); }; loop();
  const pins=el('div','lkpins');
  Object.entries(PLACE).forEach(([id,P])=>{ const p=LK.places[id]; if(!p) return;
    const b=el('button','lkpin'+(P.locked?' lock':'')+(id===here?' here':''),''); b.style.left=(p[0]/320*100)+'%'; b.style.top=((p[1]-8)/200*100)+'%'; b.setAttribute('aria-label',P.de);
    b.onclick=()=>pick(id); pins.appendChild(b); });
  COMPASS.forEach(([l,de,en,x,y])=>{ const b=el('button','lkpin cmp',''); b.style.left=(x/320*100)+'%'; b.style.top=((y-4)/200*100)+'%'; b.setAttribute('aria-label',de);
    b.onclick=()=>{ speak(de); learn(de.toLowerCase().replace('ü','ue'),1,true); info.innerHTML=`<b>${l}</b> = <b>${de}</b> <span class="en">(${en})</span>`; }; pins.appendChild(b); });
  wrap.appendChild(pins); pBody.appendChild(wrap);
  const info=el('div','lkinfo',here==='town'?'Du bist hier: <b>Lindendorf</b>':`Du bist hier: <b>${esc(PLACE[here].de)}</b>`); pBody.appendChild(info);
  const area=el('div','lkarea'); pBody.appendChild(area);
  speak('Wohin?');
  function pick(id){
    const P=PLACE[id]; if(walker) return;
    if(P.locked){ speak(P.de); info.innerHTML=`<b>${esc(P.de)}</b>: kommt bald! <span class="en">(coming soon)</span>`; return; }
    if(id===here){ info.innerHTML='Du bist schon hier! <span class="en">(You are already here!)</span>'; speak('Du bist schon hier!'); return; }
    learn(id==='wald'?'wald':id==='markt'?'altstadt':'landkarte',0);
    const n=(S.travel&&S.travel[id])||0;
    if(n<3) build(id); else go(id,true);
  }
  function chips(parts,vIdx){ return `<div class="bkline">${parts.map((p,i)=>`<span class="ch${i===vIdx?' v':''}"><span class="cw">${tapText(p)}</span><i>${i+1}</i></span>`).join('')}</div>`; }
  function build(id){
    const P=PLACE[id], verb=player.flying?'fliege':'gehe', slots=[null,null,null];
    const bank=shuffle([verb,'ich',P.phrase,P.wrong]);
    area.innerHTML=`<div class="bkq"><div class="kick">Reise-Satz · ${(S.travel&&S.travel[id])||0}/3</div><h3>Build the sentence!</h3><div class="en">“Now I ${player.flying?'fly':'go'} ${id==='town'?'to Lindendorf':id==='wald'?'into the enchanted forest':'into the old town'}.”</div></div>`;
    const line=el('div','bkline'), bk=el('div','lbank'), fb=el('div','bkfb','');
    area.appendChild(line); area.appendChild(bk); area.appendChild(fb);
    const render=()=>{
      const parts=[['Jetzt',false],[slots[0],true],[slots[1],true],[slots[2],true]];
      line.innerHTML=parts.map((p,i)=>`<span class="ch${p[1]?' slot':''}${p[1]&&!p[0]?' empty':''}" data-i="${i}"><span class="cw">${p[0]?esc(p[0]):'&nbsp;?&nbsp;'}</span><i>${i+1}</i></span>`).join('');
      line.querySelectorAll('.ch.slot').forEach(s=>s.onclick=()=>{ const k=+s.dataset.i-1; if(slots[k]){ bank.push(slots[k]); slots[k]=null; fb.innerHTML=''; render(); } });
      bk.innerHTML=''; bank.forEach((w,j)=>{ const t=el('button','ltile',esc(w)); t.dataset.w=w; t.onclick=()=>{ const k=slots.indexOf(null); if(k<0) return; slots[k]=w; bank.splice(j,1); speak(w); render(); check(); }; bk.appendChild(t); });
    };
    const check=()=>{ if(slots.includes(null)) return;
      if(slots[0]!==verb){ sfx('wrong'); fb.innerHTML='<b>Jetzt</b> is part 1, so <b>place 2 is for the verb</b>. Tap a tile to take it back.'; S.verbMiss=(S.verbMiss||0)+1; return; }
      if(slots[1]!=='ich'){ sfx('wrong'); fb.innerHTML='Nearly! After the verb comes the person: <b>ich</b>.'; return; }
      if(slots[2]!==P.phrase){ sfx('wrong'); fb.innerHTML='Check where you are going: '+P.rule; return; }
      sfx('good'); learn('verb',1); line.querySelectorAll('.ch')[1].classList.add('v');
      fb.innerHTML=`Ja! ${P.rule}<div class="en">${esc(P.dir)} <i>(${esc(P.dirEn)})</i></div>`;
      setTimeout(()=>go(id,false),1500);
    };
    render();
  }
  function go(id,auto){
    const P=PLACE[id], verb=player.flying?'fliege':'gehe', sent=['Jetzt',verb,'ich',P.phrase];
    if(!S.travel) S.travel={}; if(!auto) S.travel[id]=(S.travel[id]||0)+1;
    area.innerHTML=chips(sent,1)+`<div class="en" style="text-align:center">${esc(P.dir)} <i>(${esc(P.dirEn)})</i></div>`;
    speak(sent.join(' '));
    const path=mapPath(here,id).map(p=>[p[0],p[1]-4]); let seg=[],tot=0;
    for(let i=1;i<path.length;i++){ const d=Math.hypot(path[i][0]-path[i-1][0],path[i][1]-path[i-1][1]); seg.push(d); tot+=d; }
    const dur=player.flying?1100:1700, t0=performance.now();
    walker={pos:path[0].slice()};
    const step=()=>{ if(done) return; const u=Math.min(1,(performance.now()-t0)/dur); let dist=u*tot, i=0; while(i<seg.length-1&&dist>seg[i]){ dist-=seg[i]; i++; }
      const a=path[i], b=path[i+1]||a, f=seg[i]?dist/seg[i]:1; walker.pos=[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f];
      if(u<1) requestAnimationFrame(step); else setTimeout(()=>{ pendingDest=id; close(); },350); };
    step();
  }
}); }
function arrive(id){
  const from=S.scene, P=PLACE[id], sp=P.spawn[from]||P.spawn._;
  loadScene(id,sp[0]*TS,sp[1]*TS); player.dir=sp[2]; player.vx=player.vy=0; fadeT=.6; hudKey=''; markDirty();
}
function edgeBack(dx,dy){ player.x+=dx*TS*.6; player.y+=dy*TS*.6; player.vx=player.vy=0; }
function checkEdges(){
  const p=player;
  if(S.scene==='town'&&p.y<1.8*TS&&p.x>22.4*TS&&p.x<25.6*TS){ edgeBack(0,1); openMap(true); return true; }
  if(S.scene==='markt'&&p.y>30.3*TS){ if(festLocked()){ p.y=30*TS; if(!busy) toast('Der Laternenumzug! Stay with Sankt Martin.',2000); return true; } edgeBack(0,-1); openMap(true); return true; }
  if(p.y>13.6*TS&&p.y<17.6*TS){
    if(S.scene==='town'&&p.x>=45.2*TS){ edgeBack(-1,0); openMap(true); return true; }
    if(S.scene==='wald'&&p.x<=2.8*TS){ edgeBack(1,0); openMap(true); return true; } }
  return false;
}
$('#btnMap').onclick=e=>{ e.currentTarget.blur(); audioInit(); if(started&&!busy){ if(inside) toast('Erst nach draußen! (Go outside first.)',1800); else openMap(false); } };
gl('landkarte','map','landkarte'); [['wohin','where to'],['jetzt','now'],['gehe','go'],['fliege','fly'],['nach','to (towns)'],['in','in / into'],['den','the'],['die','the'],['altstadt','old town'],['zauberwald','enchanted forest'],
 ['liegt','lies / is located'],['im','in the'],['norden','north'],['osten','east'],['süden','south'],['westen','west'],['mitte','middle'],['der','the'],['lindendorf','Lindendorf'],['du','you'],['bist','are'],['schon','already'],['hier','here'],['kommt','comes'],['bald','soon']].forEach(([k,e])=>gl(k,e));
})();

</script>
